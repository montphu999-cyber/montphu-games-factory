<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Coffee FIXED Score</title><style>body{margin:0;background:#FFF8E8;font-family:system-ui;display:flex;justify-content:center}#b{max-width:420px;width:100%;background:#fff;min-height:100vh}.h{display:flex;justify-content:space-between;padding:12px;font-weight:900;background:#5D4037;color:#fff;font-size:18px}canvas{width:100%;height:280px;background:#f5e6c8;display:block;border:2px solid #000}.c{border:2px solid #000;border-radius:10px;padding:10px;margin:6px;display:flex;justify-content:space-between;align-items:center}.btn{width:96%;margin:8px 2%;background:#FFB300;border:3px solid #000;padding:16px;border-radius:999px;font-weight:900;font-size:20px}.pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;font-weight:900;color:#FFB300;text-shadow:3px 3px 0 #000;display:none}</style></head><body><div id=b><div class=h><span id=m>฿0</span><span id=s>Score 0</span><span id=r>⭐5</span></div><canvas id=cv></canvas><div id=list></div><button class=btn id=brew>☕ BREW +5</button></div><div id=pop class=pop>+100</div><script>
let money=0,score=0,rep=5,orders=[];const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=400;cv.height=280;const mEl=document.getElementById('m'),sEl=document.getElementById('s'),rEl=document.getElementById('r'),listEl=document.getElementById('list'),popEl=document.getElementById('pop');
function upd(){mEl.textContent='฿'+money;sEl.textContent='Score '+score;rEl.textContent='⭐'+rep}function pop(t){popEl.textContent=t;popEl.style.display='block';setTimeout(()=>popEl.style.display='none',600)}
function spawn(){if(orders.length<3)orders.push({id:Date.now()+Math.random(),name:['Oliang','Cha Yen','Americano'][Math.random()*3|0],pat:100})}setInterval(spawn,2000);
function loop(){ctx.clearRect(0,0,400,280);ctx.fillStyle='#8D6E63';ctx.fillRect(0,200,400,80);listEl.innerHTML=orders.map(o=>`<div class=c><span>${o.name} ${o.pat|0}%</span><button style="padding:8px 16px;font-weight:900;border:2px solid #000;border-radius:999px" onclick="serve(${o.id})">Serve +100</button></div>`).join('');orders.forEach(o=>{o.pat-=0.2;if(o.pat<=0){orders=orders.filter(x=>x.id!=o.id);rep--;if(rep<=0){alert('Game Over Score:'+score);rep=5;score=0;money=0;orders=[]}}});upd();requestAnimationFrame(loop)}loop();
window.serve=(id)=>{let o=orders.find(x=>x.id==id);if(o){orders=orders.filter(x=>x.id!=o.id);money+=40;score+=100;pop('+100');upd();}};
document.getElementById('brew').onclick=()=>{score+=5;money+=2;pop('+5');ctx.fillStyle='#FFB300';ctx.beginPath();ctx.arc(200+Math.random()*80-40,100,18,0,7);ctx.fill();upd();};upd();
</script></body></html>
