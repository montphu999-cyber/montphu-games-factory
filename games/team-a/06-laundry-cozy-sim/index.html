<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Coffee Thai Tycoon REAL</title><style>body{margin:0;background:#FFF8E8;font-family:system-ui;display:flex;justify-content:center}#b{max-width:420px;width:100%;background:#fff;min-height:100vh}.h{display:flex;justify-content:space-between;padding:10px;font-weight:900;background:#5D4037;color:#fff}canvas{width:100%;height:300px;background:#f5e6c8;display:block}.c{border:2px solid #000;border-radius:10px;padding:8px;margin:6px;display:flex;justify-content:space-between}.btn{width:96%;margin:6px 2%;background:#FFB300;border:3px solid #000;padding:12px;border-radius:999px;font-weight:900;font-size:18px}</style></head><body><div id=b><div class=h><span id=m>฿0</span><span id=s>Score 0</span><span id=r>⭐5</span></div><canvas id=cv></canvas><div id=list></div><button class=btn id=brew>☕ BREW - ชงกาแฟ</button><div style="font-size:10px;text-align:center">PayPal:phuonlinenew@gmail.com PromptPay:0811113693 REAL 100%</div></div><script>let money=0,score=0,rep=5,orders=[];const cv=document.getElementById('cv'),ctx=cv.getContext('2d');cv.width=400;cv.height=300;function spawn(){if(orders.length<3)orders.push({id:Date.now(),name:['Oliang','Cha Yen','Americano'][Math.random()*3|0],pat:100})}setInterval(spawn,1800);function loop(){ctx.clearRect(0,0,400,300);ctx.fillStyle='#8D6E63';ctx.fillRect(0,220,400,80);document.getElementById('list').innerHTML=orders.map(o=>`<div class=c><span>${o.name} ${o.pat|0}%</span><button onclick="serve(${o.id})">Serve</button></div>`).join('');orders.forEach(o=>{o.pat-=0.25;if(o.pat<=0){orders=orders.filter(x=>x.id!=o.id);rep--;if(rep<=0){alert('Game Over Score:'+score);rep=5;score=0;money=0}}});document.getElementById('m').textContent='฿'+money;document.getElementById('s').textContent='Score '+score;document.getElementById('r').textContent='⭐'+rep;requestAnimationFrame(loop)}loop();function serve(id){let o=orders.find(x=>x.id==id);if(o){orders=orders.filter(x=>x.id!=id);money+=40;score+=100;}}document.getElementById('brew').onclick=()=>{ctx.fillStyle='#FFB300';ctx.beginPath();ctx.arc(200+Math.random()*80-40,150,18,0,7);ctx.fill();score+=5};</script></body></html>
